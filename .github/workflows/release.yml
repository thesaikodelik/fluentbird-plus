name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build Windows installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*) ;; *) VERSION="0.0.0-dev" ;; esac
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-H windowsgui -X main.appVersion=${VERSION} -X main.updateRepo=${GITHUB_REPOSITORY}" \
            -o FluentbirdPlus-Setup.exe ./installer
          sha256sum FluentbirdPlus-Setup.exe > FluentbirdPlus-Setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: FluentbirdPlus-Setup
          path: FluentbirdPlus-Setup.exe*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FluentbirdPlus-Setup.exe
            FluentbirdPlus-Setup.exe.sha256
